name: MLOps CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/ml-credit-service
  PYTHON_VERSION: "3.11"

jobs:
  # -------------------------------------------------------------
  # Stage 1: Linting and Code Quality Gate
  # -------------------------------------------------------------
  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black

      - name: Code Formatting Check (Black)
        run: |
          black --check src tests scripts api

      - name: Syntax & Style Linting (Flake8)
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings
          flake8 src tests --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

  # -------------------------------------------------------------
  # Stage 2: Unit, Integration, & Drift Tests
  # -------------------------------------------------------------
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Execute Pytest Suite
        run: |
          python -m pytest -v --tb=short

  # -------------------------------------------------------------
  # Stage 3: Model Quality Gate (Automated Training & Evaluation)
  # -------------------------------------------------------------
  model-quality-gate:
    name: Model Evaluation Gate
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train and Evaluate Baseline Model
        run: |
          # Fails if ROC-AUC is below 0.75
          python src/train.py --samples 5000 --artifact-dir artifacts --version ${{ github.sha }} --min-roc-auc 0.75

      - name: Upload Trained Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: artifacts/
          retention-days: 7

  # -------------------------------------------------------------
  # Stage 4: Docker Container Build & Security Scan
  # -------------------------------------------------------------
  build-container:
    name: Container Build & Verification
    runs-on: ubuntu-latest
    needs: [model-quality-gate]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Model Artifacts
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: artifacts/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Local Test)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ml-credit-service:latest,ml-credit-service:${{ github.sha }}
          load: true

      - name: Container Smoke Test (Healthcheck)
        run: |
          docker run -d --name smoke-test -p 8000:8000 ml-credit-service:latest
          sleep 8
          curl --fail http://localhost:8000/live || exit 1
          curl --fail http://localhost:8000/health || exit 1
          docker stop smoke-test && docker rm smoke-test

  # -------------------------------------------------------------
  # Stage 5: Kubernetes Manifests Validation
  # -------------------------------------------------------------
  validate-k8s:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    needs: [build-container]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Validate K8s Manifests Dry-Run
        run: |
          kubectl apply --dry-run=client -f k8s/ -R
