[project]
name = "mlops-model-deployment-monitoring"
version = "1.0.0"
description = "Production ML Model API with Prometheus Metrics and Real-time Drift Detection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "scikit-learn>=1.4.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "joblib>=1.3.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "prometheus_client>=0.20.0",
    "requests>=2.31.0",
]

[tool.vercel]
entrypoint = "src.app:app"
