apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: mlops
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-service.mlops.svc.cluster.local:9090
        isDefault: true
        editable: true
        jsonData:
          timeInterval: 5s
