apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: mlops
data:
  dashboard-provider.yaml: |
    apiVersion: 1
    providers:
      - name: 'MLOps Dashboards'
        orgId: 1
        folder: 'MLOps'
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
